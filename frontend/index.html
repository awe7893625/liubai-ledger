<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Ledger — 留白工作室｜Apple Pay 自動記帳</title>
    <meta
      name="description"
      content="留白工作室開源記帳系統：實際介面預覽、互動示範、捷徑下載與完整 Apple Pay 安裝教學。把交易留在自己的私人帳本。"
    />
    <meta
      property="og:title"
      content="Ledger｜留白工作室 — 讓每次感應，自然成帳"
    />
    <meta
      property="og:description"
      content="看實際畫面、試用示範、安裝捷徑。留白工作室的 local-first 開源記帳系統。"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://liubai-ledger.vercel.app/screens/site-desktop.webp"
    />
    <meta name="theme-color" content="#F3EFE6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      window.addEventListener("vite:preloadError", () => {
        try {
          if (!sessionStorage.getItem("ledger-preload-reloaded")) {
            sessionStorage.setItem("ledger-preload-reloaded", "1");
            location.reload();
          }
        } catch (_) {
          /* Respect restricted browser storage. */
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
